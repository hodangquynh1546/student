name: edutrack

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-edutrack}
      POSTGRES_USER: ${DB_USERNAME:-edutrack_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-edutrack}
      DATABASE_USER: ${DB_USERNAME:-edutrack_user}
      DATABASE_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@edutrack.local}
      ADMIN_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-CHANGE_ME_WITH_16_CHARACTERS}
      ADMIN_NAME: ${ADMIN_NAME:-Giáo viên}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_HOST: ${MAIL_HOST:-mailpit}
      SMTP_PORT: ${MAIL_PORT:-1025}
      SMTP_USER: ${MAIL_USERNAME:-}
      SMTP_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@edutrack.local}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-60}
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-local}
      FILE_STORAGE_LOCAL_PATH: /app/uploads
      FILE_MAX_SIZE_MB: ${FILE_MAX_SIZE_MB:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8
    networks: [internal]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"
    networks: [internal]

volumes:
  postgres_data:
  upload_data:

networks:
  internal:
